<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <!-- Cache busting ?v=3 added to force browser to refresh the icon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e91e8c">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bombon - Tienda de Ropa</title>
    <meta name="description" content="Encuentra las últimas tendencias en ropa y moda en Bombón. Variedad de prendas, envíos rápidos y la mejor calidad." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiendabombon.netlify.app/" />
    <meta property="og:title" content="Bombon - Tienda de Ropa" />
    <meta property="og:description" content="Explora nuestra colección exclusiva de moda." />
    <meta property="og:image" content="https://i.ibb.co/3Y7f0fM/bombon-logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tiendabombon.netlify.app/" />
    <meta property="twitter:title" content="Bombon - Tienda de Ropa" />
    <meta property="twitter:description" content="Explora nuestra colección exclusiva de moda." />
    <meta property="twitter:image" content="https://i.ibb.co/3Y7f0fM/bombon-logo.png" />
    

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <style>
      :root {
        --primary: #e91e8c;
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
      }
      
      /* Cyberpunk theme variables */
      [data-theme='men'] {
        --primary: #e91e8c; /* Fuchsia */
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
        --primary-gradient: linear-gradient(to right, #3b82f6, #e91e8c);
      }

      /* Cyberpunk theme specific styles */
      [data-theme='men'] .cyber-border {
        border: 1px solid var(--primary);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      }

      [data-theme='men'] .cyber-gradient-bg {
        background: var(--primary-gradient) !important;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>

    <!-- Critical startup styles work before JavaScript and the compiled stylesheet load. -->
    <style id="store-loading-styles">
      body { margin:0; }
      .store-startup { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:#fff8fb; color:#5d4037; text-align:center; font-family:Arial,sans-serif; }
      .store-startup__content { width:100%; max-width:340px; }
      .store-startup__mark { position:relative; width:88px; height:88px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
      .store-startup__ring { position:absolute; inset:0; border:3px solid #fce4ec; border-top-color:#e91e8c; border-right-color:#f48fb1; border-radius:50%; animation:store-startup-spin 1.1s linear infinite; }
      .store-startup__letter { font:italic 46px Georgia,serif; color:#e91e8c; }
      .store-startup__brand { margin:0; font:bold 36px Georgia,serif; color:#880e4f; }
      .store-startup__slogan { margin:8px 0 0; font-size:14px; color:#880e4f; }
      .store-startup__message { margin:28px 0 0; font-size:14px; line-height:1.6; }
      .store-startup__dots { display:flex; justify-content:center; gap:7px; margin-top:16px; }
      .store-startup__dots span { width:6px; height:6px; border-radius:50%; background:#e91e8c; animation:store-startup-pulse 1.2s ease-in-out infinite; }
      .store-startup__dots span:nth-child(2) { animation-delay:.15s; }
      .store-startup__dots span:nth-child(3) { animation-delay:.3s; }
      .store-startup__retry { margin-top:20px; border:0; border-radius:24px; padding:12px 24px; background:#e91e8c; color:#fff; cursor:pointer; font:inherit; }
      .store-startup__mark--paused .store-startup__ring { animation:none; }
      @keyframes store-startup-spin { to { transform:rotate(360deg); } }
      @keyframes store-startup-pulse { 0%,80%,100% { opacity:.35; transform:translateY(0); } 40% { opacity:1; transform:translateY(-4px); } }
      @media (prefers-reduced-motion:reduce) { .store-startup .store-startup__ring, .store-startup .store-startup__dots span { animation:none; } }
    </style>
</head>
<body class="bg-background font-sans text-on-surface">
    <div id="root"><div class="store-startup" role="status" aria-live="polite" aria-label="Cargando tienda Bombón"><div class="store-startup__content"><div class="store-startup__mark" aria-hidden="true"><span class="store-startup__ring"></span><span class="store-startup__letter">B</span></div><p class="store-startup__brand">Bombón</p><p class="store-startup__slogan">Ponte bonita para ti.</p><p class="store-startup__message">Cargando tienda…</p><div class="store-startup__dots" aria-hidden="true"><span></span><span></span><span></span></div></div></div></div>
    <noscript>Activa JavaScript para consultar el catálogo de Bombón.</noscript>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
