    <style>
      :root {
        --primary: #e91e8c;
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
      }
      
      /* Cyberpunk theme variables */
      [data-theme='men'] {
        --primary: #e91e8c; /* Fuchsia */
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
        --primary-gradient: linear-gradient(to right, #3b82f6, #e91e8c);
      }

      /* Cyberpunk theme specific styles */
      [data-theme='men'] .cyber-border {
        border: 1px solid var(--primary);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      }

      [data-theme='men'] .cyber-gradient-bg {
        background: var(--primary-gradient) !important;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>

    <!-- Critical startup styles work before JavaScript and the compiled stylesheet load. -->
    <style id="store-loading-styles">
      body { margin:0; }
      .store-startup { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:#fff; color:#1f2937; text-align:center; font-family:Poppins,Arial,sans-serif; }
      .store-startup__content { display:flex; flex-direction:column; align-items:center; max-width:340px; }
      /* Keep a visible turn instead of the global 0.01ms reduced-motion duration. */
      .store-startup__spinner { display:block; width:40px; height:40px; color:#e91e8c; animation:store-loading-spin 1s linear infinite !important; transform-origin:center; }
      .store-startup__track { opacity:.25; }
      .store-startup__segment { opacity:.75; }
      .store-startup__message { margin:16px 0 0; font-size:16px; line-height:1.5; }
      .store-startup__retry { margin-top:20px; border:0; border-radius:24px; padding:12px 24px; background:#e91e8c; color:#fff; cursor:pointer; font:inherit; }
      @keyframes store-loading-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion:reduce) { .store-startup__spinner { animation-duration:2s !important; } }
    </style>
</head>
<body class="bg-background font-sans text-on-surface">
    <div id="root"><div class="store-startup" role="status" aria-live="polite" aria-label="Cargando tienda Bombón"><div class="store-startup__content"><svg class="store-startup__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="store-startup__track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="store-startup__segment" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="store-startup__message">Descubre tu próximo outfit</p></div></div></div>
