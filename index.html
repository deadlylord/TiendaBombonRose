<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <!-- Cache busting ?v=3 added to force browser to refresh the icon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=3">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e91e8c">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bombon - Tienda de Ropa</title>
    <meta name="description" content="Encuentra las últimas tendencias en ropa y moda en Bombón. Variedad de prendas, envíos rápidos y la mejor calidad." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiendabombon.netlify.app/" />
    <meta property="og:title" content="Bombon - Tienda de Ropa" />
    <meta property="og:description" content="Explora nuestra colección exclusiva de moda." />
    <meta property="og:image" content="https://i.ibb.co/3Y7f0fM/bombon-logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tiendabombon.netlify.app/" />
    <meta property="twitter:title" content="Bombon - Tienda de Ropa" />
    <meta property="twitter:description" content="Explora nuestra colección exclusiva de moda." />
    <meta property="twitter:image" content="https://i.ibb.co/3Y7f0fM/bombon-logo.png" />
    

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary: #e91e8c;
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
      }
      
      /* Cyberpunk theme variables */
      [data-theme='men'] {
        --primary: #e91e8c; /* Fuchsia */
        --primary-light: #f472b6;
        --primary-dark: #db2777;
        --background: #ffffff;
        --surface: #f9fafb;
        --on-surface: #1f2937;
        --primary-gradient: linear-gradient(to right, #3b82f6, #e91e8c);
      }

      /* Cyberpunk theme specific styles */
      [data-theme='men'] .cyber-border {
        border: 1px solid var(--primary);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      }

      [data-theme='men'] .cyber-gradient-bg {
        background: var(--primary-gradient) !important;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .scrollbar-hide {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
</head>
<body class="bg-background font-sans text-on-surface">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
